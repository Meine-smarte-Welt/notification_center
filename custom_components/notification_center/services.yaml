# SHA256 (Inhalt ab Zeile 2, d.h. dieser Datei ohne diese erste Zeile): 2e1e94b8d6a0cc863a4a7576e0d9ceb60cd10eac8a9e66f0d409bece2ba6fcd2
send:
  fields:
    recipient:
      required: true
      example: "Thorsten Handy"
      selector:
        text:
    message:
      required: true
      example: "Die Waschmaschine ist fertig."
      selector:
        text:
          multiline: true
    title:
      required: false
      example: "Waschmaschine"
      selector:
        text:
    urgency:
      required: false
      default: normal
      selector:
        select:
          translation_key: urgency
          options:
            - normal
            - high
            - critical
