# SHA256 (Inhalt ab Zeile 2, d.h. dieser Datei ohne diese erste Zeile): 6110ef72424ccd70dc0a69e1809f6dcfdc92ccce7b0eff283dfa8f74e8912446
send:
  fields:
    recipient:
      required: true
      example: "Thorsten Handy"
      selector:
        text:
    message:
      required: true
      example: "Die Waschmaschine ist fertig."
      selector:
        text:
          multiline: true
    title:
      required: false
      example: "Waschmaschine"
      selector:
        text:
    urgency:
      required: false
      default: normal
      selector:
        select:
          translation_key: urgency
          options:
            - normal
            - high
            - critical

report:
  fields:
    message:
      required: true
      example: "3 fehlende Entitäten"
      selector:
        text:
          multiline: true
    title:
      required: false
      example: "Watchman-Bericht"
      selector:
        text:
    source:
      required: false
      example: "Watchman"
      selector:
        text:
    key:
      required: false
      example: "default"
      selector:
        text:
    state:
      required: false
      default: active
      selector:
        select:
          options:
            - active
            - resolved
    severity:
      required: false
      default: info
      selector:
        select:
          translation_key: severity
          options:
            - critical
            - warning
            - info
            - ok
    domain:
      required: false
      example: "watchman"
      selector:
        text:
    icon:
      required: false
      example: "mdi:eye-check"
      selector:
        icon:

inbound:
  fields:
    rule:
      required: true
      example: "watchman"
      selector:
        text:
