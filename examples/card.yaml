# Beispiel: Dashboard-Karte (Notification Center 1.2.1)
type: custom:notification-center-card
title: Notification Center
show_title: true
icon: mdi:bell-badge-outline
default_tab: messages        # messages | notifications | updates | repairs | send | settings
default_sort: default        # default | newest | oldest | title
show_messages: true
show_notifications: true
show_updates: true
show_repairs: true
show_send: true
show_settings: true
show_search: true
show_filter_bar: true
show_stats: true
show_group_by: true
default_group_by: none         # none | integration | severity | type (je nach Liste verfügbar)
show_builder: true
read_only: false
zoom: 100
max_rows: 0
entities:
  messages: sensor.notification_center_meldungen
  notifications: sensor.notification_center_benachrichtigungen
  updates: sensor.notification_center_updates
  repairs: sensor.notification_center_reparaturen
  recipients: sensor.notification_center_profile
